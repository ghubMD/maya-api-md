monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:   # environnement de développement
    monolog:
        handlers:   # gestionnaires de logs
            main:
                type: rotating_file
                max_files: 3
                path: "%kernel.logs_dir%/%kernel.environment%.all.log"
                level: info
                channels: ["!event"]
            doctrine:
                type: rotating_file
                max_files: 3
                path: "%kernel.logs_dir%/%kernel.environment%.doctrine.log"
                channels: ["doctrine"]
            login:
                type: rotating_file
                max_files: 3
                path: "%kernel.logs_dir%/%kernel.environment%.security.log"
                channels: ["security"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:  # environnement de test
    monolog:
        handlers:
            main:
                type: fingers_crossed   # pour filtrer les entrées en fonction de leur niveau
                                        #   et les transmettre à un autre gestionnaire
                action_level: error     # niveau minimum pour déclencher le gestionnaire
                handler: nested         # gestionnaire à appeler pour traiter les entrées filtrées
                excluded_http_codes: [404, 405]     # exclut ces codes HTTP
                channels: ["!event"]    # quelles catégories d'entrées sont autorisées ou non
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:  # environnement de production
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
