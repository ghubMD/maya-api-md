name: CI simple

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: php bin/phpunit tests/Unit/Entity/CategorieUnitTest.php --log-junit junit.xml

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: PHPUnit Tests
          path: junit.xml
          reporter: java-junit